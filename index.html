<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Learning Platform</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .landing {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .brand {
            text-align: center;
            margin-bottom: 70px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .brand h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .brand p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .roles {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .role-card {
            width: 300px;
            height: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .role-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, var(--accent-glow), transparent 65%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .role-card:hover {
            transform: translateY(-8px);
            border-color: var(--card-hover-border);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6);
        }

        .role-card:hover::before { opacity: 1; }

        .role-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            margin-bottom: 28px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .role-icon svg { width: 80px; height: 80px; }

        .role-card:hover .role-icon {
            transform: scale(1.06);
            border-color: var(--accent);
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .role-title {
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            position: relative;
            z-index: 1;
            line-height: 1.4;
        }

        .role-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="landing">
        <div class="brand">
            <div class="brand-logo">G</div>
            <h1>GPU Learning Platform</h1>
            <p>Платформа для обучения и распределения GPU-ресурсов</p>
        </div>

        <div class="roles">
            <!-- Ученик / Преподаватель -->
            <a href="user_main.html" class="role-card glass-panel">
                <div class="role-icon" style="background:#e8f4ff;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="role-title">Ученик / Преподаватель</div>
                <div class="role-sub">Доступ к обучению и группам</div>
            </a>

            <!-- Администратор -->
            <a href="admin_panel.html" class="role-card glass-panel">
                <div class="role-icon" style="background:#1a1f1d;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/>
                        <circle cx="12" cy="11" r="2.5"/>
                    </svg>
                </div>
                <div class="role-title">Администратор</div>
                <div class="role-sub">Управление системой</div>
            </a>
        </div>
    </div>

</body>
</html>
