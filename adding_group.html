<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание группы — GPU Platform</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            max-width: 640px;
            margin: 0 auto;
            padding: 52px;
        }

        .form-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .form-header-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(46,204,113,0.15), rgba(22,163,74,0.05));
            border: 1px solid rgba(46,204,113,0.25);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            color: var(--accent-bright);
            box-shadow: 0 8px 30px rgba(46,204,113,0.15);
        }

        .form-header-icon svg { width: 30px; height: 30px; }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 12px;
            padding: 18px;
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .form-container { padding: 32px 24px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="top-bar">
            <a href="user_main.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="page-title">Создание группы</h1>
        </div>

        <div class="form-container glass-panel fade-in">
            <div class="form-header">
                <div class="form-header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </div>
                <h2>Новая группа</h2>
                <p>Заполните параметры для создания учебной группы</p>
            </div>

            <form id="createGroupForm">
                <div class="form-group">
                    <label class="form-label">Название группы</label>
                    <input type="text" class="form-input" placeholder="Например: Machine Learning Basics" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">GPU на группу</label>
                        <input type="number" class="form-input" placeholder="4" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Доля на студента (%)</label>
                        <input type="number" class="form-input" placeholder="25" min="1" max="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Лимит использования (часов)</label>
                    <input type="number" class="form-input" placeholder="10" min="1" required>
                </div>

                <button type="submit" class="btn btn-primary submit-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Создать группу
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
