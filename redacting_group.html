<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование группы</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            max-width: 780px;
            margin: 0 auto;
            padding: 48px;
        }

        .form-header {
            margin-bottom: 36px;
        }

        .form-header h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .form-header p { color: var(--text-secondary); font-size: 0.9rem; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .students-preview {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid var(--card-border);
        }

        .students-preview h3 {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .student-chip {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .student-chip:hover {
            border-color: var(--card-hover-border);
            background: rgba(46,204,113,0.06);
        }

        .student-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .student-avatar svg { width: 22px; height: 22px; }

        .student-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 36px;
        }

        .actions .btn { flex: 1; padding: 18px; }

        .btn-ghost {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            color: #fff;
        }

        .btn-ghost:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .form-container { padding: 28px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="top-bar">
            <a href="user_main.html" class="back-btn">←</a>
            <h1 class="page-title">Редактирование группы</h1>
        </div>

        <div class="form-container glass-panel">
            <div class="form-header">
                <h2>Machine Learning Basics</h2>
                <p>Измените параметры группы и состав участников</p>
            </div>

            <form>
                <div class="form-group">
                    <label class="form-label">Название группы</label>
                    <input type="text" class="form-input" value="Machine Learning Basics">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Количество GPU на группу</label>
                        <input type="number" class="form-input" value="4">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Доля GPU на студента (%)</label>
                        <input type="number" class="form-input" value="25">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Ограничение на использование (в часах)</label>
                    <input type="number" class="form-input" value="10">
                </div>

                <div class="students-preview">
                    <h3>Состав группы</h3>
                    <div class="students-grid">
                        <div class="student-chip">
                            <div class="student-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="student-name">Иван Иванов</span>
                        </div>
                        <div class="student-chip">
                            <div class="student-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="student-name">Пётр Петров</span>
                        </div>
                        <div class="student-chip">
                            <div class="student-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="student-name">Анна Смирнова</span>
                        </div>
                        <div class="student-chip">
                            <div class="student-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="student-name">Дмитрий Козлов</span>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-ghost">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
