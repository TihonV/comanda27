<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование группы — GPU Platform</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 52px;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .students-preview {
            margin-top: 36px;
            padding-top: 32px;
            border-top: 1px solid var(--glass-border);
        }

        .students-preview h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 18px;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .student-chip {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            transition: all 0.35s var(--ease);
        }

        .student-chip:hover {
            border-color: rgba(46, 204, 113, 0.3);
            background: rgba(46, 204, 113, 0.06);
            transform: translateY(-2px);
        }

        .student-avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            color: #0c4a6e;
        }

        .student-avatar svg { width: 20px; height: 20px; }

        .student-name {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 36px;
        }

        .actions .btn { flex: 1; padding: 18px; }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .form-container { padding: 32px 24px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="top-bar">
            <a href="user_main.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="page-title">Редактирование группы</h1>
        </div>

        <div class="form-container glass-panel fade-in">
            <div class="form-header">
                <h2>Machine Learning Basics</h2>
                <p>Измените параметры группы и состав участников</p>
            </div>

            <form id="editGroupForm">
                <div class="form-group">
                    <label class="form-label">Название группы</label>
                    <input type="text" class="form-input" value="Machine Learning Basics" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">GPU на группу</label>
                        <input type="number" class="form-input" value="4" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Доля на студента (%)</label>
                        <input type="number" class="form-input" value="25" min="1" max="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Лимит использования (часов)</label>
                    <input type="number" class="form-input" value="10" min="1" required>
                </div>

                <div class="students-preview">
                    <h3>Состав группы</h3>
                    <div class="students-grid">
                        <div class="student-chip">
                            <div class="student-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="student-name">Иван Иванов</span>
                        </div>
                        <div class="student-chip">
                            <div class="student-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="student-name">Пётр Петров</span>
                        </div>
                        <div class="student-chip">
                            <div class="student-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="student-name">Анна Смирнова</span>
                        </div>
                        <div class="student-chip">
                            <div class="student-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="student-name">Дмитрий Козлов</span>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-ghost">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
