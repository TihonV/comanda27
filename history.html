<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История — GPU Platform</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .history-table {
            padding: 12px;
            overflow: hidden;
        }

        .table-header, .table-row {
            display: grid;
            grid-template-columns: 1.4fr 1.4fr 0.9fr;
            align-items: center;
            padding: 20px 28px;
            gap: 20px;
        }

        .table-header {
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            padding-bottom: 10px;
        }

        .table-row {
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            transition: all 0.35s var(--ease);
            font-size: 0.92rem;
            border: 1px solid transparent;
        }

        .table-row:hover {
            background: rgba(46, 204, 113, 0.05);
            border-color: rgba(46, 204, 113, 0.15);
            transform: translateX(6px);
        }

        .student-cell {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 600;
        }

        .student-avatar {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            color: #0c4a6e;
        }

        .student-avatar svg { width: 22px; height: 22px; }

        .time-cell {
            color: var(--accent-bright);
            font-weight: 700;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .group-cell { color: var(--text-secondary); font-size: 0.88rem; }

        @media (max-width: 700px) {
            .table-header { display: none; }
            .table-row {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 18px;
            }
            .time-cell { text-align: left; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="top-bar">
            <a href="user_main.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="page-title">История использований</h1>
        </div>

        <div class="history-table glass-panel fade-in">
            <div class="table-header">
                <span>Ученик</span>
                <span>Группа</span>
                <span style="text-align:right;">Время</span>
            </div>

            <div class="table-row">
                <div class="student-cell">
                    <div class="student-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <span>Иван Иванов</span>
                </div>
                <span class="group-cell">Machine Learning</span>
                <span class="time-cell">13:00 – 14:00</span>
            </div>

            <div class="table-row">
                <div class="student-cell">
                    <div class="student-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <span>Пётр Петров</span>
                </div>
                <span class="group-cell">Deep Learning</span>
                <span class="time-cell">13:00 – 14:00</span>
            </div>

            <div class="table-row">
                <div class="student-cell">
                    <div class="student-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <span>Анна Смирнова</span>
                </div>
                <span class="group-cell">Computer Vision</span>
                <span class="time-cell">12:00 – 13:00</span>
            </div>

            <div class="table-row">
                <div class="student-cell">
                    <div class="student-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <span>Дмитрий Козлов</span>
                </div>
                <span class="group-cell">Machine Learning</span>
                <span class="time-cell">11:00 – 12:00</span>
            </div>

            <div class="table-row">
                <div class="student-cell">
                    <div class="student-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <span>Елена Новикова</span>
                </div>
                <span class="group-cell">Deep Learning</span>
                <span class="time-cell">10:00 – 11:00</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
